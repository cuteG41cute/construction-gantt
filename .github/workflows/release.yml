name: 构建校验 / Build Check

# 说明：本项目【不在云端自动发布 exe】，采用"本地打包 + 手动上传到 Release"的方式。
# 原因：GitHub Actions 的 Windows runner 上构建出的 exe 与本地构建体积差异较大，
#       且 GitHub 对非 ASCII 文件名处理有问题（中文名会被替换成 "_"）。
#       为对使用者负责，发布包统一在本地构建并实测通过后再上传。
#
# 本工作流只做"能不能打包成功"的冒烟校验，不产出发布附件。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  smoke-build:
    runs-on: windows-latest

    steps:
      - name: 检出代码 / Checkout
        uses: actions/checkout@v4

      - name: 安装 Python / Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖 / Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller openpyxl

      - name: 打包冒烟测试 / Smoke build
        run: |
          python -m PyInstaller --noconfirm --onefile --windowed `
            --name "construction-gantt" `
            gantt_tool.py
          Get-ChildItem dist

      - name: 检查产物 / Inspect artifact
        shell: pwsh
        run: |
          $exe = Get-Item "dist\construction-gantt.exe"
          Write-Host ("构建产物大小: {0:N1} MB" -f ($exe.Length / 1MB))
          if ($exe.Length -lt 5MB) {
            Write-Error "产物过小（小于 5MB），可能缺少 Tkinter 等依赖！"
            exit 1
          }
          Write-Host "OK 构建产物大小正常"

      - name: 上传以供排查 / Upload for inspection
        uses: actions/upload-artifact@v4
        with:
          name: smoke-build
          path: dist/*
          retention-days: 7
